[package]
edition      = "2024"
name         = "hawkeye"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "hawkeye"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "log-04"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-println      = { version = "0.18.0", features = ["esp32s3", "log-04"] }

hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
lora-phy = "3.0.1"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-hal-async = "1.0.0"
embedded-sdmmc = { version = "0.9", default-features = false }
heapless = "0.9"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[features]
# Pick exactly one role (there is no default, a build without one fails with a message):
#   cargo build --release --features balloon    balloon
#   cargo build --release --features ground     ground station
balloon = []
ground = []
default = []
